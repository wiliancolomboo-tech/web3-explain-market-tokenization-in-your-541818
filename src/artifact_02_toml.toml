[package]
name = "solana_rwa_tokenization"
version = "0.1.0"
description = "US SEC Reg D/S Compliant Institutional RWA Token Engine on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_rwa_tokenization"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
spl-token-2022 = { version = "0.11.0", features = ["no-entrypoint"] }
spl-transfer-hook-interface = "0.6.3"
spl-tlv-account-resolution = "0.6.3"
solana-program = "1.18.26"