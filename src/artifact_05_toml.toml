[package]
name = "rwa-compliance-engine"
version = "0.1.0"
description = "US SEC Reg D/S Compliant Transfer Hook Engine for Institutional RWAs on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "rwa_compliance_engine"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
spl-transfer-hook-interface = "0.6.3"
spl-tlv-account-resolution = "0.6.3"
spl-type-length-value = "0.4.3"
solana-program = "=1.18.26"
thiserror = "1.0"