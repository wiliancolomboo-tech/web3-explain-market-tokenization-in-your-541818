[package]
name = "solpath_hook"
version = "1.0.0"
description = "SolPath Token-2022 Transfer Hook Compliance Enforcer"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solpath_hook"

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
spl-token-2022 = { version = "0.13.0", features = ["no-entrypoint"] }
spl-transfer-hook-interface = "0.6.5"