version: '3.8'

services:
  rwa-compliance-relay:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=RWA1111111111111111111111111111111111111111
      - RWA_MINT=M1NT111111111111111111111111111111111111111
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_enterprise_123456789
      - COMPLIANCE_OFFICER_EMAIL=officer@fintech-fund.com
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"