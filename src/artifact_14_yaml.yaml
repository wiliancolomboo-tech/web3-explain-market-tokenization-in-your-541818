version: "3.8"

services:
  soltokenize-compliance-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soltokenize_engine
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_123456789
      - COMPLIANCE_KEYPAIR_JSON=[1,2,3,4,5,...] # Paste 64-byte keypair array
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"