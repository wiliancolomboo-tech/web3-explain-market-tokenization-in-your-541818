version: '3.8'

services:
  helvetia-compliance-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helvetia-audit-daemon
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - TOKEN_MINT=CHd1t8uR9pY6wV3qK4eZJkL2mS5nN8pQ1rT4uW7xY9z
      - ISIN_CODE=CH1234567890
      - RESEND_API_KEY=${RESEND_API_KEY}
      - AUDIT_WEBHOOK_URL=${AUDIT_WEBHOOK_URL}
      - PORT=8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"