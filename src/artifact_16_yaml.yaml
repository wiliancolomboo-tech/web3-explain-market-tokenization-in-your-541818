version: '3.8'

services:
  aegis-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis_rwa_sentinel
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ENTERPRISE_WEBHOOK_URL=${ENTERPRISE_WEBHOOK_URL}
      - COMPLIANCE_OFFICER_EMAIL=${COMPLIANCE_OFFICER_EMAIL}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3