[package]
name = "us-market-tokenization"
version = "0.1.0"
description = "US SEC Reg D/S Market Tokenization Engine on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "us_market_tokenization"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
solana-program = "=1.18.17"