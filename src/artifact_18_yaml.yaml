version: '3.8'

services:
  solrwa-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solrwa-compliance-worker
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - COMPLIANCE_SIGNER_KEYPAIR_JSON=[1,2,3...255]
      - RESEND_API_KEY=re_test_000000000000000000000000
      - RESEND_FROM_EMAIL=compliance@solrwa-institutional.com
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - PORT=8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3